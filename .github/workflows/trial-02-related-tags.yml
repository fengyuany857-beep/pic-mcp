name: Trial 02 - Related Tag Assembly E2E

on:
  push:
    branches: [main]
    paths:
      - 'trials/upo-01d/**'
      - 'trials/upo-02/**'
      - '.github/workflows/trial-02-related-tags.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  related-tag-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trial harness
        uses: actions/checkout@v4

      - name: Checkout pinned upstream organ
        uses: actions/checkout@v4
        with:
          repository: echo-xianyu/Booru-Pictag-Get-MCP
          ref: ed234568fc376517d0abc5a377d65af37981b059
          path: trials/upo-02/upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'mcp==1.30.0' 'pydantic>=2,<3' 'scikit-learn>=1.5,<2'
          python -m pip install './trials/upo-02/upstream[http2]'

      - name: Capture environment fingerprint
        working-directory: trials/upo-02
        run: |
          mkdir -p artifacts/trial02
          python --version | tee artifacts/trial02/python-version.txt
          python -m pip freeze > artifacts/trial02/pip-freeze.txt
          git -C upstream rev-parse HEAD > artifacts/trial02/upstream-commit.txt
          sha256sum ../upo-01d/src/upo_recommender/models.py ../upo-01d/src/upo_recommender/adapters.py ../upo-01d/src/upo_recommender/recommend.py > artifacts/trial02/frozen-core-sha256.txt

      - name: Run Trial 02 real E2E
        working-directory: trials/upo-02
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/run_trial02_related_tags.py

      - name: Upload Trial 02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-02-related-tags-evidence-${{ github.run_attempt }}
          path: trials/upo-02/artifacts/trial02/
          if-no-files-found: warn
          retention-days: 30
