name: Trial 06 - Deploy PicMCP Pixiv Auth Worker

on:
  workflow_dispatch:
  push:
    branches:
      - trial/upo-06-pixiv-mobile-oauth
    paths:
      - 'trials/upo-06/worker/**'
      - '.github/workflows/trial-06-deploy-picmcp-auth-worker.yml'

permissions:
  contents: read

jobs:
  deploy-picmcp-auth-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout PicMCP
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify frozen prior trials untouched
        run: |
          git diff --exit-code 077f802e395e3d78e38e96292b4203655939bdd4 HEAD -- \
            trials/upo-01d trials/upo-02 trials/upo-03 trials/upo-04

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install pinned Worker MCP dependencies
        working-directory: trials/upo-06/worker
        run: npm install --no-audit --no-fund

      - name: Typecheck Worker
        run: |
          npx --yes -p typescript@5.9.2 tsc -p trials/upo-06/worker/tsconfig.json

      - name: Check Cloudflare deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo '::error::PicMCP repository is missing CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID.'
            exit 78
          fi
          echo 'Cloudflare credential presence: PASS'

      - name: Ensure isolated OAuth KV namespace and bind it for this deployment
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_TITLE: pic-mcp-auth-trial06-oauth
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "${API}?per_page=100&order=title&direction=asc" > /tmp/kv-list.json

          KV_ID="$(python - <<'PY'
          import json, os
          data = json.load(open('/tmp/kv-list.json'))
          title = os.environ['KV_TITLE']
          matches = [x['id'] for x in data.get('result', []) if x.get('title') == title]
          print(matches[0] if matches else '')
          PY
          )"

          if [ -z "$KV_ID" ]; then
            echo 'OAuth KV namespace not found; creating isolated Trial 06 namespace.'
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "{\"title\":\"${KV_TITLE}\"}" \
              "$API" > /tmp/kv-create.json
            KV_ID="$(python - <<'PY'
          import json
          data = json.load(open('/tmp/kv-create.json'))
          result = data.get('result') or {}
          print(result.get('id', ''))
          PY
            )"
          fi

          test -n "$KV_ID"
          printf '%s\n' "$KV_ID" > /tmp/oauth-kv-id.txt
          python - <<'PY'
          import json
          from pathlib import Path
          cfg_path = Path('trials/upo-06/worker/wrangler.jsonc')
          cfg = json.loads(cfg_path.read_text())
          kv_id = Path('/tmp/oauth-kv-id.txt').read_text().strip()
          cfg['kv_namespaces'] = [{'binding': 'OAUTH_KV', 'id': kv_id}]
          cfg_path.write_text(json.dumps(cfg, indent=2) + '\n')
          print('OAUTH_KV_BINDING_READY')
          PY

      - name: Deploy isolated PicMCP auth Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.131.2'
          workingDirectory: 'trials/upo-06/worker'
          command: deploy

      - name: Verify deployed HTTPS health and OAuth discovery gates
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          printf '%s\n' "$DEPLOYMENT_URL" > /tmp/deployment-url.txt
          curl --fail --silent --show-error "$DEPLOYMENT_URL/health" > /tmp/health.json
          curl --fail --silent --show-error \
            "$DEPLOYMENT_URL/.well-known/oauth-authorization-server" > /tmp/oauth-as.json
          curl --fail --silent --show-error \
            "$DEPLOYMENT_URL/.well-known/oauth-protected-resource/mcp" > /tmp/oauth-resource.json
          curl --silent --show-error --dump-header /tmp/mcp-unauthorized.headers \
            --output /tmp/mcp-unauthorized.body --write-out '%{http_code}' \
            -X POST -H 'content-type: application/json' -d '{}' "$DEPLOYMENT_URL/mcp" \
            > /tmp/mcp-status.txt

          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/health.json').read_text())
          auth = json.loads(Path('/tmp/oauth-as.json').read_text())
          resource = json.loads(Path('/tmp/oauth-resource.json').read_text())
          status = Path('/tmp/mcp-status.txt').read_text().strip()
          headers = Path('/tmp/mcp-unauthorized.headers').read_text().lower()
          base = Path('/tmp/deployment-url.txt').read_text().strip()

          assert health.get('ok') is True
          assert health.get('service') == 'pic-mcp-auth-trial06'
          assert health.get('mcp') == 'oauth2.1'
          assert health.get('mcp_endpoint') == '/mcp'
          assert health.get('oauth_scope') == 'favorites:read'

          assert auth.get('issuer') == base
          assert auth.get('authorization_endpoint') == base + '/authorize'
          assert auth.get('token_endpoint') == base + '/oauth/token'
          assert auth.get('registration_endpoint') == base + '/oauth/register'
          assert 'authorization_code' in auth.get('grant_types_supported', [])
          assert 'S256' in auth.get('code_challenge_methods_supported', [])

          assert resource.get('resource') == base + '/mcp'
          assert base in resource.get('authorization_servers', [])
          assert 'favorites:read' in resource.get('scopes_supported', [])

          assert status == '401', status
          assert 'www-authenticate:' in headers
          assert 'bearer' in headers
          assert 'resource_metadata=' in headers
          print('REMOTE_HEALTH_PASS')
          print('REMOTE_OAUTH_AUTHORIZATION_SERVER_METADATA_PASS')
          print('REMOTE_OAUTH_PROTECTED_RESOURCE_METADATA_PASS')
          print('REMOTE_MCP_OAUTH_CHALLENGE_PASS')
          PY

      - name: Verify mobile sync session route remains available
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H 'content-type: application/json' \
            -d '{}' \
            "$DEPLOYMENT_URL/auth/pixiv/mobile/session" > /tmp/session.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/session.json'))
          assert data.get('status') == 'PENDING'
          sid = data.get('session_id')
          assert isinstance(sid, str) and len(sid) >= 32
          assert data.get('expires_in_seconds') == 300
          print('REMOTE_SESSION_ISSUANCE_REGRESSION_PASS')
          PY

      - name: Independently read back synchronized Pixiv library from remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: trials/upo-06/worker
        run: |
          set -euo pipefail
          npx --yes wrangler@4.131.2 d1 execute pic-mcp-auth-trial06-auth-db \
            --remote --json \
            --command "SELECT public_count, private_count, item_count, complete, truncated_reason, updated_at FROM user_library_state WHERE source='pixiv';" \
            > /tmp/library-state.json
          npx --yes wrangler@4.131.2 d1 execute pic-mcp-auth-trial06-auth-db \
            --remote --json \
            --command "SELECT COUNT(*) AS actual_count, SUM(CASE WHEN library_visibility='public' THEN 1 ELSE 0 END) AS actual_public, SUM(CASE WHEN library_visibility='private' THEN 1 ELSE 0 END) AS actual_private FROM user_library_items WHERE source='pixiv';" \
            > /tmp/library-counts.json
          python - <<'PY'
          import json
          from pathlib import Path

          def rows(path):
              raw = json.loads(Path(path).read_text())
              blocks = raw if isinstance(raw, list) else [raw]
              for block in blocks:
                  if isinstance(block, dict) and isinstance(block.get('results'), list):
                      return block['results']
              raise AssertionError(f'No D1 results in {path}')

          state_rows = rows('/tmp/library-state.json')
          count_rows = rows('/tmp/library-counts.json')
          assert len(state_rows) == 1, state_rows
          assert len(count_rows) == 1, count_rows
          state = state_rows[0]
          counts = count_rows[0]
          item_count = int(state['item_count'])
          public_count = int(state['public_count'])
          private_count = int(state['private_count'])
          actual_count = int(counts['actual_count'])
          actual_public = int(counts['actual_public'] or 0)
          actual_private = int(counts['actual_private'] or 0)
          assert item_count > 0
          assert item_count == actual_count
          assert public_count == actual_public
          assert private_count == actual_private
          assert item_count == public_count + private_count
          print(f'REMOTE_D1_LIBRARY_READBACK_PASS item_count={item_count} public={public_count} private={private_count} complete={state["complete"]}')
          PY

      - name: Write safe deployment evidence
        if: always()
        run: |
          mkdir -p trials/upo-06/artifacts/deploy
          if [ -f /tmp/deployment-url.txt ]; then cp /tmp/deployment-url.txt trials/upo-06/artifacts/deploy/deployment-url.txt; fi
          if [ -f /tmp/health.json ]; then cp /tmp/health.json trials/upo-06/artifacts/deploy/health.json; fi
          if [ -f /tmp/oauth-as.json ]; then cp /tmp/oauth-as.json trials/upo-06/artifacts/deploy/oauth-authorization-server.json; fi
          if [ -f /tmp/oauth-resource.json ]; then cp /tmp/oauth-resource.json trials/upo-06/artifacts/deploy/oauth-protected-resource.json; fi
          if [ -f /tmp/oauth-kv-id.txt ]; then cp /tmp/oauth-kv-id.txt trials/upo-06/artifacts/deploy/oauth-kv-id.txt; fi
          printf 'head=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > trials/upo-06/artifacts/deploy/provenance.txt

      - name: Upload safe deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-06-picmcp-auth-worker-deploy-${{ github.run_number }}
          path: trials/upo-06/artifacts/deploy/
          if-no-files-found: warn
          retention-days: 30
