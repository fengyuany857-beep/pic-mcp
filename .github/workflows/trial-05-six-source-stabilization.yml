name: Trial 05 - Six Source Stabilization

on:
  push:
    branches: ['trial/upo-05-six-source-stabilization']
    paths:
      - 'trials/upo-05/**'
      - '.github/workflows/trial-05-six-source-stabilization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DANBOORU_USERNAME: ${{ secrets.DANBOORU_USERNAME }}
      DANBOORU_API_KEY: ${{ secrets.DANBOORU_API_KEY }}
      GELBOORU_USER_ID: ${{ secrets.GELBOORU_USER_ID }}
      GELBOORU_API_KEY: ${{ secrets.GELBOORU_API_KEY }}
      RULE34_USER_ID: ${{ secrets.RULE34_USER_ID }}
      RULE34_API_KEY: ${{ secrets.RULE34_API_KEY }}
      PIXIV_REFRESH_TOKEN: ${{ secrets.PIXIV_REFRESH_TOKEN }}

    steps:
      - name: Checkout PicMCP Trial branch
        uses: actions/checkout@v4

      - name: Checkout pinned Booru organ
        uses: actions/checkout@v4
        with:
          repository: echo-xianyu/Booru-Pictag-Get-MCP
          ref: ed234568fc376517d0abc5a377d65af37981b059
          path: trials/upo-05/upstream-booru

      - name: Checkout pinned Pixiv organ
        uses: actions/checkout@v4
        with:
          repository: 222wcnm/pixiv-mcp-server
          ref: c02e5e67c82f7774b028ccf669567a4d386d1016
          path: trials/upo-05/upstream-pixiv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned runtime and organs
        working-directory: trials/upo-05
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'mcp==1.30.0' 'pydantic>=2.11,<3' 'numpy>=2,<3' 'scikit-learn>=1.7,<2' 'httpx[http2]>=0.27,<1' 'pytest>=8.2,<9'
          python -m pip install './upstream-booru[http2]'
          python -m pip install './upstream-pixiv'

      - name: Capture provenance and old-trial immutability
        working-directory: trials/upo-05
        run: |
          mkdir -p artifacts/trial05
          python --version | tee artifacts/trial05/python-version.txt
          python -m pip freeze > artifacts/trial05/pip-freeze.txt
          git -C upstream-booru rev-parse HEAD > artifacts/trial05/booru-upstream-commit.txt
          git -C upstream-pixiv rev-parse HEAD > artifacts/trial05/pixiv-upstream-commit.txt
          git -C ../.. diff --exit-code 077f802e395e3d78e38e96292b4203655939bdd4 -- trials/upo-01d trials/upo-02 trials/upo-03 trials/upo-04

      - name: Verify reused Pixiv preview proxy contract
        working-directory: trials/upo-05
        run: python -m pytest -q upstream-pixiv/tests/test_preview_proxy.py

      - name: Run six-source live/read-only matrix
        working-directory: trials/upo-05
        run: python scripts/run_six_source_matrix.py

      - name: Upload Trial 05 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-05-six-source-evidence-${{ github.run_number }}
          path: trials/upo-05/artifacts/trial05/
          if-no-files-found: warn
          retention-days: 30
