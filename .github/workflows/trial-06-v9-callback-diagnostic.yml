name: Trial 06 - v9 Callback Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - trial/upo-06-pixiv-mobile-oauth
    paths:
      - '.github/workflows/trial-06-v9-callback-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose-v9-callback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect safe callback telemetry and OAuth KV stage
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_SERVICE: pic-mcp-auth-trial06
          KV_TITLE: pic-mcp-auth-trial06-oauth
        run: |
          set -euo pipefail
          QUERY_API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/observability/telemetry/query"
          KV_API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces"

          python - <<'PY'
          import json, os, time
          from pathlib import Path
          now = int(time.time() * 1000)
          payload = {
              'queryId': 'picmcp-v9-safe-callback',
              'timeframe': {'from': now - 45*60*1000, 'to': now + 60*1000},
              'dry': True,
              'limit': 200,
              'view': 'events',
              'parameters': {
                  'datasets': [],
                  'filterCombination': 'and',
                  'filters': [
                      {'key': '$metadata.service', 'operation': 'eq', 'type': 'string', 'value': os.environ['WORKER_SERVICE']},
                      {'key': '$metadata.message', 'operation': 'includes', 'type': 'string', 'value': 'PICMCP_AUTH_REDIRECT_SAFE'},
                  ],
              },
          }
          Path('/tmp/query.json').write_text(json.dumps(payload))
          PY

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary '@/tmp/query.json' \
            "${QUERY_API}" > /tmp/query-result.json

          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/query-result.json').read_text())
          assert data.get('success') is True, data.get('errors')
          events = (((data.get('result') or {}).get('events') or {}).get('events') or [])
          safe=[]
          marker='PICMCP_AUTH_REDIRECT_SAFE '
          for event in events:
              if not isinstance(event, dict):
                  continue
              metadata = event.get('$metadata') or {}
              msg = metadata.get('message') if isinstance(metadata, dict) else None
              if not isinstance(msg, str) or marker not in msg:
                  continue
              payload = msg.split(marker,1)[1].strip()
              try:
                  obj = json.loads(payload)
              except Exception:
                  safe.append({'parse':'failed'})
                  continue
              allowed = {
                  'status','redirect_present','redirect_kind','code_present','state_present',
                  'state_matches_request','iss_present','iss_matches_origin','error_present'
              }
              safe.append({k: obj.get(k) for k in sorted(allowed) if k in obj})
          print('V9_CALLBACK_SAFE_COUNT', len(safe))
          print('V9_CALLBACK_SAFE_SUMMARY', safe)
          PY

          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "${KV_API}?per_page=100" > /tmp/namespaces.json

          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/namespaces.json').read_text())
          ids=[x['id'] for x in data.get('result',[]) if x.get('title')==os.environ['KV_TITLE']]
          assert len(ids)==1, f'Expected one OAuth KV namespace, got {len(ids)}'
          Path('/tmp/kv-id.txt').write_text(ids[0])
          PY

          KV_ID="$(cat /tmp/kv-id.txt)"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "${KV_API}/${KV_ID}/keys?limit=1000" > /tmp/keys.json

          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/keys.json').read_text())
          counts={'client':0,'grant':0,'token':0,'other':0}
          for item in data.get('result',[]):
              name=item.get('name','')
              if name.startswith('client:'): counts['client']+=1
              elif name.startswith('grant:'): counts['grant']+=1
              elif name.startswith('token:'): counts['token']+=1
              else: counts['other']+=1
          print('OAUTH_KV_KEY_COUNTS', counts)
          PY
