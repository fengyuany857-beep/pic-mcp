name: PicMCPAuthHelper
options:
  minimumXcodeGenVersion: 2.46.0
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  PicMCPAuthHelper:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../ios-helper-v2/Sources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.picmcp.authhelper
        INFOPLIST_FILE: ../ios-helper-v2/Sources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        SWIFT_STRICT_CONCURRENCY: minimal
